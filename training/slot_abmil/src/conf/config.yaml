# ============================================================================
# BEAVER — slot / ABMIL training config for the SUBMITTED model (path7c).
# These values reproduce the submitted slot checkpoint
#   sloton/checkpoints/network_epoch_150.pth   (run name: hopt1run2)
# Encoder features = H-optimus-1 patch embeddings at 20x (mpp ~0.5), extracted
# with TRIDENT and stored as per-slide .h5 bags under ${FEATURES_DIR}
# (see ../../preprocess/README.md). Absolute paths are ${PLACEHOLDERS};
# set them for your layout (see ../../../REPRODUCE.md).
# ============================================================================
defaults:
  - _self_
  - app_cfg

training:
  epochs: 150
  bag_size: 256
  batch_size: 16
  train_data_part: 0.75
  precision: fp16
  start_lr: 4e-5
  seed: 42
  max_grad_norm: 10
  weight_decay: 1e-4

model:
  train_device: "cuda:0"
  eval_device: "cuda:1"
  num_channels: 256
  embed_dim: 128
  ff_dim: 128
  num_blocks: 4
  num_layers_transformer: 4
  num_heads_transformer: 4
  num_attention_heads_abmil: 4
  num_layers_abmil: 3
  dropout_abmil: 0.5
  slide_feature_encoder_dim: 1024
  trainable_pos_emb: true
  model_checkpoint: null

data:
  data_suffix: ".h5"
  max_num_datapoints: null
  train_json_path: ${oc.env:TRAIN_JSON}          # train_from_CoT.json (per-slide CoT + labels)
  train_data_path: ${oc.env:FEATURES_DIR}        # H-optimus-1 .h5 feature bags (TRIDENT, 20x)
  experiment_path: ${oc.env:EXPERIMENT_DIR}      # output dir for checkpoints / logs
  experiment_name: "hopt1run2"
  site_count_threshold: 10
  extraction_count_threshold: 10
  normalize: false
  mean: [0.9505, 0.9375, 0.9510]
  std: [0.0762, 0.1088, 0.0727]

  # ─── slot supervision ─────────────────────────────────────────────────────
  # baseline 그대로 돌리려면: use_slot_supervision: false
  # slot 실험 두 가지:
  #   1) merged   : Rectum/Anus→Colon, Nipple→Breast (7 organ head)
  #   2) separate : 모든 organ 단독 (site filter 통과한 organ만, 보통 8개)
  use_slot_supervision: true
  organ_grouping: "merged"   # "merged" or "separate"
  slot_cot_dir: ${oc.env:SLOT_COT_DIR}    # per-organ CoT codebooks (train_CoT_organ/)
  slot_skip_first_n: 2   # Q01(organ), Q02(procedure) skip — site/extraction head와 중복
  slot_skip_last_n: 1    # final diagnosis skip — sparse + decoder와 중복
  slot_loss_weight: 1.0

dataloader:
  num_workers: 16
  pin_memory: false
  drop_last: false
  prefetch_factor: 2

text:
  pad_idx: 0
  sos_idx: 1
  eos_idx: 2
  n_gram: 10

other:
  dry_run: false
  verbose: true
  disable_TQDM: false

eval:
  run_text: false
  run_embedding: false
  save_json: true
  eval_rate: 50
  test_data_path: null
